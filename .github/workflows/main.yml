name: Build and Release

on:
  pull_request:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release tag to create (leave empty to bump the patch version)'
        required: false
        type: string

# Ensures that only one run per branch/tag will run at a time.
concurrency:
  group: environment-${{ github.ref }}
  cancel-in-progress: true

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}
  # Releases are only published for pushed v* tags or manual runs
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          install: true
      - name: Log into registry ${{ env.REGISTRY }}
        if: env.RELEASE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@v3
      - name: Check out the repository to the runner
        uses: actions/checkout@v4
      - name: Bump version and push tag
        id: tag_version
        if: github.event_name == 'workflow_dispatch'
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ inputs.tag }}
      - name: Determine release tag
        if: env.RELEASE == 'true'
        run: echo "TAG=${{ steps.tag_version.outputs.new_tag || github.ref_name }}" >> "$GITHUB_ENV"
      - name: Build the builder
        run: ./zquickinit.sh builder --githubaction --load
      - name: Push OCI package to registry
        if: env.RELEASE == 'true'
        run: ./zquickinit.sh builder --githubaction --push --tag ghcr.io/midzelis/zquickinit:latest --tag ghcr.io/midzelis/zquickinit:${{ env.TAG }}
      - name: Build initramfs
        run: ./zquickinit.sh initramfs --no-ask --release
      - name: Build ISO
        run: sudo apt-get install -y mtools xorriso coreutils findutils && ./zquickinit.sh iso
      - name: Upload build artifacts
        if: env.RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zquickinit
          path: |
            output/zquickinit.efi
            zquickinit.iso
      - name: Create a GitHub release
        if: env.RELEASE == 'true'
        uses: ncipollo/release-action@v1.12.0
        with:
          tag: ${{ env.TAG }}
          name: Release ${{ env.TAG }}
          body: ${{ steps.tag_version.outputs.changelog }}
          generateReleaseNotes: ${{ steps.tag_version.outputs.changelog == '' }}
          removeArtifacts: true
          artifacts: "output/zquickinit.efi,zquickinit.iso"
          allowUpdates: true
